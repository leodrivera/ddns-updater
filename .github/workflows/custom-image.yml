# Fork-only workflow (not part of upstream): builds the `custom` branch — upstream master plus
# the fork's extra commits — and publishes it as ghcr.io/<owner>/ddns-updater.
#   :custom             latest build of the branch (what deployments track)
#   :custom-<shortsha>  immutable, for pinning or rolling back
name: Custom image
on:
  push:
    branches:
      - custom
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ddns-updater"
          short="$(git rev-parse --short HEAD)"
          {
            echo "tags=${image}:custom,${image}:custom-${short}"
            echo "short=${short}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          platforms: linux/amd64
          build-args: |
            CREATED=${{ steps.meta.outputs.created }}
            COMMIT=${{ steps.meta.outputs.short }}
            VERSION=custom
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
